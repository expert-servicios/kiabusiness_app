name: Supabase Ledger Preflight

on:
  push:
    branches:
      - ops/supabase-ledger-preflight-20260912

permissions:
  contents: read

concurrency:
  group: supabase-ledger-preflight-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only ledger preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap

    steps:
      - name: Checkout reviewed operations commit
        uses: actions/checkout@v4

      - name: Verify required secrets are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'STOP: SUPABASE_ACCESS_TOKEN secret is not configured'; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'STOP: SUPABASE_DB_PASSWORD secret is not configured'; exit 1; }

      - name: Verify active 36-file baseline layout
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          test "${#files[@]}" -eq 36
          test "${files[0]}" = '20260912000100_baseline_public_primitives.sql'
          test "${files[35]}" = '20260912003600_baseline_public_acl.sql'

      - name: Setup validated Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production and capture migration list
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked > "$RUNNER_TEMP/migration-list-before.txt"

      - name: Capture exact ledger backup and validate frozen state
        shell: bash
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/ledger-preflight"
          mkdir -p "$private"
          chmod 700 "$private"
          raw="$private/schema_migrations_before_20260912.raw.sql"
          restore="$private/schema_migrations_before_20260912.pg15.sql"

          supabase db dump \
            --linked \
            --schema supabase_migrations \
            --data-only \
            --use-copy \
            --file "$raw"
          test -s "$raw"

          mapfile -t versions < <(
            awk 'BEGIN { FS="\t" }
              /^COPY supabase_migrations\.schema_migrations / { inside=1; next }
              inside && $0 == "\\." { inside=0; next }
              inside { print $1 }
            ' "$raw"
          )

          test "${#versions[@]}" -eq 133 || { echo "STOP: expected 133 ledger rows, got ${#versions[@]}"; exit 1; }
          test "${versions[0]}" = '20260508082323' || { echo 'STOP: unexpected first ledger version'; exit 1; }
          test "${versions[132]}" = '20260911174615' || { echo 'STOP: unexpected production migration tip'; exit 1; }

          if printf '%s\n' "${versions[@]}" | grep -q '^2026091200'; then
            echo 'STOP: baseline tracking versions already exist remotely'
            exit 1
          fi

          empty_statements="$(awk 'BEGIN { FS="\t" }
            /^COPY supabase_migrations\.schema_migrations / { inside=1; next }
            inside && $0 == "\\." { inside=0; next }
            inside && ($2 == "\\N" || $2 == "{}" || $2 == "") { empty++ }
            END { print empty+0 }
          ' "$raw")"
          test "$empty_statements" -eq 0 || { echo "STOP: $empty_statements legacy ledger rows have empty statements"; exit 1; }

          sha256sum "$raw" > "$private/schema_migrations_before_20260912.raw.sha256"

          grep -q '^SET transaction_timeout = 0;$' "$raw" || { echo 'STOP: expected PG17 dump compatibility line not found'; exit 1; }
          sed '/^SET transaction_timeout = 0;$/d' "$raw" > "$restore"
          test -s "$restore"
          sha256sum "$restore" > "$private/schema_migrations_before_20260912.pg15.sha256"

          raw_hash="$(cut -d' ' -f1 "$private/schema_migrations_before_20260912.raw.sha256")"
          restore_hash="$(cut -d' ' -f1 "$private/schema_migrations_before_20260912.pg15.sha256")"
          cli_version="$(supabase --version)"
          cat > "$private/preflight-manifest.txt" <<EOF
          project_ref=$PROJECT_REF
          production_postgres=15.8
          supabase_cli=$cli_version
          ledger_rows=133
          first_version=20260508082323
          last_version=20260911174615
          empty_statements=0
          raw_sha256=$raw_hash
          pg15_restore_sha256=$restore_hash
          EOF

          cp "$RUNNER_TEMP/migration-list-before.txt" "$private/migration-list-before.txt"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:SUPABASE_DB_PASSWORD \
            -in "$raw" \
            -out "$private/schema_migrations_before_20260912.raw.sql.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:SUPABASE_DB_PASSWORD \
            -in "$restore" \
            -out "$private/schema_migrations_before_20260912.pg15.sql.enc"

          rm -f "$raw" "$restore"
          chmod 600 "$private"/*

      - name: Upload encrypted rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-ledger-preflight-20260912
          path: ${{ runner.temp }}/ledger-preflight/
          if-no-files-found: error
          retention-days: 14
