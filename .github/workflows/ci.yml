name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Supabase migration baseline check
        run: npm run check:supabase-migrations

      - name: Tests
        run: npm test

  migration-repair-contract:
    name: Supabase migration repair contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migration repair tracking-only semantics
        shell: bash
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/repair-probe"
          mkdir -p "$workdir/supabase/migrations"
          printf 'project_id = "repair-probe"\n' > "$workdir/supabase/config.toml"
          cat > "$workdir/supabase/migrations/20990101000000_repair_probe_contract.sql" <<'SQL'
          create table public.repair_probe_contract (
            id bigint primary key
          );
          SQL

          supabase --workdir "$workdir" migration repair 20990101000000 \
            --db-url "$DB_URL" \
            --status applied

          test "$(psql "$DB_URL" -Atc "select count(*) from supabase_migrations.schema_migrations where version='20990101000000'")" = "1"
          test "$(psql "$DB_URL" -Atc "select to_regclass('public.repair_probe_contract') is null")" = "t"

          statement_count="$(psql "$DB_URL" -Atc "select coalesce(array_length(statements,1),0) from supabase_migrations.schema_migrations where version='20990101000000'")"
          echo "repair-applied statement_count=$statement_count"
          test "$statement_count" -gt 0

          supabase --workdir "$workdir" migration repair 20990101000000 \
            --db-url "$DB_URL" \
            --status reverted
          test "$(psql "$DB_URL" -Atc "select count(*) from supabase_migrations.schema_migrations where version='20990101000000'")" = "0"
