# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "ksenia_expert"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
# #143 fresh-build validation only. This activation exists exclusively on
# validation/supabase-baseline-fresh-20260911 and must never be merged as-is.
# Environment-bound production URL/identity objects are deliberately excluded.
schema_paths = [
  "./baseline-candidate/10_public_primitives.sql",
  "./baseline-candidate/11_public_tables_001_040.sql",
  "./baseline-candidate/12_public_tables_041_080.sql",
  "./baseline-candidate/13_public_tables_081_120.sql",
  "./baseline-candidate/14_public_tables_121_155.sql",
  "./baseline-candidate/15_public_table_20260911174615.sql",
  "./baseline-candidate/20_public_constraints_001_100.sql",
  "./baseline-candidate/21_public_constraints_101_200.sql",
  "./baseline-candidate/22_public_constraints_201_300.sql",
  "./baseline-candidate/23_public_constraints_301_400.sql",
  "./baseline-candidate/24_public_constraints_401_500.sql",
  "./baseline-candidate/25_public_constraints_501_553.sql",
  "./baseline-candidate/26_public_constraints_20260911174615.sql",
  "./baseline-candidate/30_public_indexes_001_100.sql",
  "./baseline-candidate/31_public_indexes_101_200.sql",
  "./baseline-candidate/32_public_indexes_201_283.sql",
  "./baseline-candidate/00_app.sql",
  "./baseline-candidate/05_private.sql",
  "./baseline-candidate/40_public_functions_001_020.sql",
  "./baseline-candidate/41_public_functions_021_040_portable.sql",
  "./baseline-candidate/42_public_functions_042_058_portable.sql",
  "./baseline-candidate/50_public_rls_enable.sql",
  "./baseline-candidate/51_public_policies_001_050.sql",
  "./baseline-candidate/52_public_policies_051_100.sql",
  "./baseline-candidate/53_public_policies_101_150.sql",
  "./baseline-candidate/54_public_policies_151_200.sql",
  "./baseline-candidate/55_public_policies_201_250.sql",
  "./baseline-candidate/56_public_policies_251_278.sql",
  "./baseline-candidate/70_public_views.sql",
  "./baseline-candidate/60_public_triggers_portable.sql",
  "./baseline-candidate/61_auth_hooks.sql",
  "./baseline-candidate/80_public_acl.sql"
]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
deno_version = 1

[analytics]
enabled = true
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
